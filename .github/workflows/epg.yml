name: Update EPG
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download EPG
        env:
          EPG_URL: ${{ secrets.EPG_URL }}
        run: |
          curl -fsSL -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124.0 Mobile Safari/537.36" -H "Accept: */*" -e "https://myepg.top/" -o epg.tmp "$EPG_URL"
