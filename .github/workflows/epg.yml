name: Update EPG
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download EPG
        env:
          EPG_URL: ${{ secrets.EPG_URL }}
        run: |
          curl -fsSL -A "Mozilla/5.0" -o epg.tmp "$EPG_URL"
          if file epg.tmp | grep -q gzip; then
            mv epg.tmp epg.xml.gz
          else
            gzip -c epg.tmp > epg.xml.gz
          fi
          rm -f epg.tmp
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add epg.xml.gz
          git commit -m "update EPG" || exit 0
          git push
